{% extends "base.html" %}
{% block content %}
    <h2>My Decks</h2>
    <a href="{{ url_for('deck_create') }}" class="btn btn-success mb-3">Create New Deck</a>
    <div class="row">
        {% for deck in decks %}
        <div class="col-md-4">
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">{{ deck.title }}</h5>
                    <p class="card-text">{{ deck.description }}</p>
                    <a href="{{ url_for('deck_detail', deck_id=deck.id) }}" class="btn btn-sm btn-primary">View</a>
                </div>
            </div>
        </div>
        {% else %}
        <p>You haven't created any decks yet.</p>
        {% endfor %}
    </div>
{% endblock %}
